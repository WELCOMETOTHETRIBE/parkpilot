# Railway / Nixpacks: Node 20 + OpenSSL 3 for Prisma (use PRISMA_QUERY_ENGINE_LIBRARY in Railway vars)
[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]
# OpenSSL 3 so Prisma debian-openssl-3.0.x engine loads when PRISMA_QUERY_ENGINE_LIBRARY is set
aptPkgs = ["libssl3", "ca-certificates"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npx prisma generate", "npm run build"]

[start]
cmd = "npm start"
